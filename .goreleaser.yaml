# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: noket

before:
  hooks:
    - go mod tidy

builds:
  - id: noket
    main: ./cmd/noket
    binary: noket
    mod_timestamp: '{{ .CommitTimestamp }}'
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
      - freebsd
    goarch:
      - '386'
      - amd64
      - arm
      - arm64
      - riscv64
    goarm:
      - '5'
      - '6'
      - '7'
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: riscv64
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

  - id: noketd
    main: ./cmd/noketd
    binary: noketd
    mod_timestamp: '{{ .CommitTimestamp }}'
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
      - freebsd
    goarch:
      - '386'
      - amd64
      - arm
      - arm64
      - riscv64
    goarm:
      - '5'
      - '6'
      - '7'
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: riscv64
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - id: noket
    ids:
      - noket
      - noketd
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}_{{ .Version }}'
    files:
      - README.md
      - LICENSE
      - config.example.toml

release:
  prerelease: auto

checksum:
  name_template: 'checksums.txt'

sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^chore'
      - '^test:'
      - 'merge conflict'
      - 'Merge pull request'
      - 'Merge remote-tracking branch'
      - 'Merge branch'
      - 'go mod tidy'
  groups:
    - title: 'New Features'
      regexp: '^feat'
      order: 100
    - title: 'Bug Fixes'
      regexp: '^fix'
      order: 200
    - title: 'Performance'
      regexp: '^perf'
      order: 300
    - title: 'Refactoring'
      regexp: '^refactor'
      order: 400
    - title: 'Documentation'
      regexp: '^docs'
      order: 500
    - title: 'Other Changes'
      order: 9999
