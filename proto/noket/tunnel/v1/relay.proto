syntax = "proto3";

package noket.tunnel.v1;

import "google/protobuf/any.proto";
import "google/rpc/status.proto";

option go_package = "github.com/noket-dev/noket/gen/noket/tunnel/v1;tunnelv1";

message Header {
  string name = 1;
  string value = 2;
}

message ForwardOpen {
  string request_id = 1;
  string method = 2;
  string path = 3;
  repeated Header headers = 4;
  bytes body = 5;
}

message ForwardChunk {
  string request_id = 1;
  int32 status = 2;
  repeated Header headers = 3;
  bytes data = 4;
  bool done = 5;
  google.rpc.Status error = 6;
}

message CancelForward {
  string request_id = 1;
}

// Unified response for every /node/upstream/* method; data is the target
// message only when status.code is OK.
message UpstreamReply {
  google.rpc.Status status = 1;
  google.protobuf.Any data = 2;
}

// Tells a gateway to close the old connection for the same nodeId.
message KickConnection {
  string node_id = 1;
  string connection_id = 2;
}
