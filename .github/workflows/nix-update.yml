name: Update flake

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flake-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Enable the Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      # A toolchain bump can change generated code, so regenerate and verify
      # here. The pull request is opened with PR_TOKEN because commits pushed
      # with GITHUB_TOKEN do not trigger CI.
      - name: Update and verify
        run: |
          nix flake update
          nix develop --command -- make generate
          nix develop --command -- make check
          nix develop --command -- make proto-lint
          nix build .#noket --no-link

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(deps): update flake.lock'
          title: 'chore(deps): update flake.lock'
          body: |
            Weekly `nix flake update`, with `gen/` regenerated and `make check` passing.
          branch: chore/flake-update
          delete-branch: true
          token: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
